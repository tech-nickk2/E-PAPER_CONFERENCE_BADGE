; ---------------------------------------------------------------------------
;  E-Paper Conference Badge  --  LilyGo T5 4.7" ESP32-S3 (and DFRobot clone)
; ---------------------------------------------------------------------------
;   pio run -t upload         build + flash
;   pio device monitor        serial console
;
;  The board definition in ./boards is copied verbatim from the LilyGo-EPD47
;  repo so this project builds without cloning that repo by hand.
; ---------------------------------------------------------------------------

[platformio]
boards_dir = boards
default_envs = badge

[env:badge]
platform      = espressif32@6.12.0
board         = T5-ePaper-S3
framework     = arduino
upload_speed  = 921600
monitor_speed = 115200

board_build.filesystem = littlefs

monitor_filters =
	default
	esp32_exception_decoder

build_flags =
	-DBOARD_HAS_PSRAM
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DLILYGO_T5_EPD47_S3
	-DCORE_DEBUG_LEVEL=1
	; qrcode.c + font rendering use sizeable VLAs; give the loop task room
	-DARDUINO_LOOP_STACK_SIZE=16384

lib_deps =
	https://github.com/Xinyuan-LilyGO/LilyGo-EPD47.git#esp32s3
	https://github.com/ricmoo/QRCode.git
	bblanchon/ArduinoJson@^7.4.2
